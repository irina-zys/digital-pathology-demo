# @package _global_
defaults:
  - override /data: wsi
  - override /model: classifier
  - override /model/pooling@model.net.pooling: mean
data:
  max_patches_per_bag: 2 # Explicit mini-bags for the brief learning-mechanics notebook.
  augment: false
model:
  net:
    encoder:
      name: resnet50
      pretrained: true
      freeze: false
      local_project: ${data.data_root}
      freeze_norm_stats: true
      source_checkpoint: null
      source_checkpoint_sha256: null
  optimizer:
    lr: 0.00001
trainer:
  max_epochs: 2
  max_time: '00:00:05:00'
  num_sanity_val_steps: 0
callbacks:
  encoder_audit:
    _target_: src.training.callbacks.EncoderUpdateAudit
    expect_update: true
test: false
