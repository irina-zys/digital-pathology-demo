defaults:
  - _self_
  - data: demo
  - masking: codait_tia_clam
  - artifacts: default
  - export: clam_hipt
  - optional local: default

thumbnail:
  max_size: 1024
  max_read_pixels: 16000000
  max_total_read_pixels: 100000000

hydra:
  # Keep provenance even when an attempted rerun is refused by the output guard.
  output_subdir: .hydra/${now:%Y-%m-%d_%H-%M-%S-%f}
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S-%f}
  job:
    chdir: false
