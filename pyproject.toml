[project]
name = "digital-pathology-demo"
version = "0.1.0"
description = "A bounded, Hydra-configured WSI preprocessing demo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hydra-core>=1.3,<1.4",
    "tiatoolbox==2.1.3",
    "numpy>=2.0,<2.4",
    "pillow>=10,<13",
    "opencv-python>=4.6,<5",
    "h5py>=3.12,<4",
]

[project.optional-dependencies]
train = ["lightning>=2.5,<3"]

[tool.uv]
package = false
