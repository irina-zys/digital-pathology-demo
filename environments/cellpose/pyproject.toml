[project]
name = "digital-pathology-cellpose-inference"
version = "0.1.0"
description = "Isolated CPU inference for the classical Cellpose nuclei model"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cellpose==3.1.1.2",
    "numpy==2.0.2",
    "torch==2.12.1",
    "pillow==12.1.1",
    "tifffile==2026.2.24",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
